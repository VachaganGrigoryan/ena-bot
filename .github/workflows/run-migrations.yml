name: Run Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify migration secret is configured
        shell: bash
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Missing PRODUCTION_DATABASE_URL secret."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Drizzle schema push
        run: npm run db:push
