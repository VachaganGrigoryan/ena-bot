services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: global_outages
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d global_outages"]
      interval: 5s
      timeout: 5s
      retries: 10

  telegram-bot:
    build:
      context: .
      target: telegram-bot
    image: global-outages-telegram-bot:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/global_outages
      NODE_ENV: production

  worker:
    build:
      context: .
      target: worker
    image: global-outages-worker:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/global_outages
      NODE_ENV: production

  migrate:
    build:
      context: .
      target: tools
    image: global-outages-tools:latest
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/global_outages
      NODE_ENV: production
    command: ["npm", "run", "db:push"]

volumes:
  postgres-data:
